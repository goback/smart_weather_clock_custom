<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SD PRO 장치 설정</title>
<style>
:root{color-scheme:light dark;font:16px/1.5 system-ui,sans-serif;accent-color:#408a68}
body{margin:0;padding:24px 16px;background:Canvas;color:CanvasText}
main{max-width:520px;margin:auto}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.1rem;margin:0 0 12px}
p{margin:8px 0}
section{border:1px solid GrayText;border-radius:12px;padding:16px;margin:14px 0}
label{display:block;margin-top:10px}
input{display:block;font:inherit;width:100%;box-sizing:border-box;margin:5px 0 10px}
input:not([type=range]):not([type=file]){border:1px solid GrayText;border-radius:6px;padding:8px}
button{font:inherit;border-radius:6px;padding:7px 11px;margin:4px 4px 0 0;cursor:pointer}
button:disabled{cursor:wait}
table{width:100%;border-collapse:collapse;margin-top:8px;text-align:left}
th,td{padding:6px 0;border-bottom:1px solid GrayText}
td:first-child{overflow-wrap:anywhere}
th:last-child,td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
#notice{min-height:1.5em;font-weight:600}
[hidden]{display:none!important}
</style>
<main>
  <h1>SD PRO 장치 설정</h1>
  <p id="device">장치 상태를 읽는 중입니다.</p>
  <p id="storage">파일 저장 공간을 확인하는 중입니다.</p>
  <p id="cleanup" role="status"></p>
  <p id="notice" role="status"></p>

  <section id="signin" hidden>
    <h2>로그인</h2>
    <form id="login" action="/api/auth/login" method="post">
      <label for="login-key">장치 비밀번호</label>
      <input id="login-key" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">로그인</button>
      <button id="show-key" type="button">장치 화면에 비밀번호 표시</button>
    </form>
  </section>

  <div id="settings" hidden>
    <section id="wifi">
      <h2>Wi-Fi</h2>
      <p id="network"></p>
      <form id="connect" action="/connect" method="post">
        <label for="ssid">네트워크 이름</label>
        <input id="ssid" name="ssid" list="networks" maxlength="32" spellcheck="false" required>
        <datalist id="networks"></datalist>
        <button id="scan" type="button">주변 Wi-Fi 찾기</button>
        <label for="wifi-key">Wi-Fi 비밀번호</label>
        <input id="wifi-key" name="password" type="password" maxlength="64" autocomplete="new-password" placeholder="비밀번호가 없는 네트워크는 비워 두세요">
        <button type="submit">저장 후 재시작</button>
      </form>
    </section>
    <section id="display">
      <h2>밝기</h2>
      <label for="level">화면 밝기 <output id="level-text" for="level">60%</output></label>
      <input id="level" type="range" min="1" max="100" value="60">
    </section>
    <section id="files">
      <h2>파일 목록</h2>
      <button id="load-files" type="button">파일 목록 조회</button>
      <p id="file-summary" role="status"></p>
      <table id="file-table" hidden>
        <thead><tr><th scope="col">경로</th><th scope="col">크기 (바이트)</th></tr></thead>
        <tbody id="file-rows"></tbody>
      </table>
    </section>
    <section>
      <h2>웹 업데이트</h2>
      <form id="ota" action="/update_ota" method="post" enctype="multipart/form-data">
        <label for="firmware">펌웨어 파일</label>
        <input id="firmware" name="update" type="file" accept=".bin,application/octet-stream" required>
        <button type="submit">업데이트 시작</button>
      </form>
    </section>
    <section id="password-settings">
      <h2>장치 비밀번호 변경</h2>
      <p>새 비밀번호는 공백 없이 영문자, 숫자, 기호로 8~31자까지 입력할 수 있습니다. 장치의 설정용 Wi-Fi에도 같은 비밀번호가 적용됩니다.</p>
      <form id="password-change" action="/api/auth/password" method="post">
        <label for="current-password">현재 비밀번호</label>
        <input id="current-password" name="current" type="password" maxlength="31" autocomplete="current-password" required>
        <label for="new-password">새 비밀번호</label>
        <input id="new-password" name="password" type="password" minlength="8" maxlength="31" autocomplete="new-password" required>
        <label for="confirm-password">새 비밀번호 확인</label>
        <input id="confirm-password" name="confirmation" type="password" minlength="8" maxlength="31" autocomplete="new-password" required>
        <button type="submit">비밀번호 변경</button>
      </form>
    </section>
    <button id="logout" type="button">로그아웃</button>
  </div>
</main>
<script>
const get = id => document.getElementById(id);
let busy = false;
let restartPending = false;
let brightnessJob = null;
let pendingBrightness = null;
let brightnessSaveTimer = null;
const notice = message => { get('notice').textContent = message; };

async function request(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    if (response.status === 401) await refreshStatus();
    throw new Error(await response.text());
  }
  return response;
}

async function refreshStatus(storageOnly = false) {
  const state = await (await fetch('/status', {cache: 'no-store'})).json();
  get('device').textContent = state.version + ' · ' + (state.ip || state.apIp)
    + (state.recovery ? ' · 복구 모드' : '');
  const mib = bytes => (bytes / 1048576).toFixed(2) + ' MiB';
  const starting = !state.storageReady && !state.recovery;
  get('storage').textContent = Number.isFinite(state.storageFreeBytes) && Number.isFinite(state.storageTotalBytes)
    ? '파일 저장 공간 ' + mib(state.storageFreeBytes) + ' 남음 / 총 ' + mib(state.storageTotalBytes)
    : starting ? '파일 저장 공간을 확인하는 중입니다.' : '파일 저장 공간을 확인할 수 없습니다.';
  const cleanupLabels = {
    running: '이전 파일을 정리하는 중입니다.',
    blocked: '저장된 설정을 확인할 수 없어 이전 파일 정리를 건너뛰었습니다.',
    complete: state.cleanupRemoved || state.cleanupSkipped
      ? '이전 파일 정리 완료 · ' + state.cleanupRemoved + '개 삭제 · ' + state.cleanupSkipped + '개 유지'
      : '이전 파일 정리 완료',
    retry: '이전 파일 정리를 일부 완료하지 못했습니다. 다음 부팅 때 이어서 확인합니다.'
  };
  get('cleanup').textContent = state.recovery ? '' : cleanupLabels[state.cleanup] || '';
  if (starting || state.cleanup === 'running') {
    setTimeout(() => {
      if (!restartPending) refreshStatus(!starting).catch(showError);
    }, 1200);
  }
  if (storageOnly) return;
  get('signin').hidden = state.signedIn;
  get('settings').hidden = !state.signedIn;
  get('wifi').hidden = get('display').hidden = !state.storageReady || state.recovery;
  get('files').hidden = !state.signedIn || !state.storageReady || state.recovery;
  if (get('files').hidden) {
    get('file-rows').replaceChildren();
    get('file-table').hidden = true;
    get('file-summary').textContent = '';
  }
  get('logout').hidden = state.recovery;
  get('password-settings').hidden = !state.signedIn || state.recovery;
  if (get('password-settings').hidden) get('password-change').reset();
  if (state.signedIn && state.storageReady && !state.recovery) {
    get('network').textContent = state.connected ? '연결됨 · ' + state.ssid
      : state.wifiError ? '연결 실패 · ' + state.wifiError : '연결 대기 중';
    get('ssid').value = state.ssid || '';
    get('level').value = state.brightness;
    showBrightness();
  }
}

function showBrightness() {
  get('level-text').textContent = get('level').value + '%';
}

// Keep at most one request in flight. Replace queued previews with the newest value.
async function drainBrightness() {
  while (pendingBrightness) {
    const {value, preview} = pendingBrightness;
    pendingBrightness = null;
    const body = new URLSearchParams({value});
    if (preview) body.set('preview', '1');
    try {
      await request('/brightness', {method: 'POST', body});
      if (!preview && !pendingBrightness && brightnessSaveTimer === null) notice('밝기를 저장했습니다.');
    } catch (error) {
      if (!pendingBrightness) showError(error);
    }
  }
  brightnessJob = null;
}

function queueBrightness(preview) {
  pendingBrightness = {value: get('level').value, preview};
  if (!brightnessJob) brightnessJob = drainBrightness();
  return brightnessJob;
}

function saveBrightness() {
  clearTimeout(brightnessSaveTimer);
  brightnessSaveTimer = null;
  return queueBrightness(false);
}

function showError(error) {
  notice(error.message || '장치에 접속할 수 없습니다.');
}

async function run(button, task) {
  if (busy || restartPending) return;
  busy = true;
  button.disabled = true;
  get('level').disabled = true;
  try {
    if (brightnessSaveTimer !== null) await saveBrightness();
    else if (brightnessJob) await brightnessJob;
    await task();
  } catch (error) { showError(error); }
  finally {
    busy = false;
    button.disabled = restartPending;
    get('level').disabled = restartPending;
  }
}

function bindForm(id, task) {
  const form = get(id);
  form.addEventListener('submit', event => {
    event.preventDefault();
    run(form.querySelector('button[type=submit]'), () => task(form));
  });
}

const postForm = form => request(form.action, {
  method: 'POST', body: new URLSearchParams(new FormData(form))
});

bindForm('login', async form => {
  await postForm(form);
  get('login-key').value = '';
  notice('');
  await refreshStatus();
});
bindForm('password-change', async form => {
  if (form.elements.password.value !== form.elements.confirmation.value) {
    throw new Error('새 비밀번호와 확인 값이 일치하지 않습니다.');
  }
  await postForm(form);
  form.reset();
  notice('장치 비밀번호를 변경했습니다. 장치의 설정용 Wi-Fi를 사용 중이라면 새 비밀번호로 다시 연결하세요.');
});
get('show-key').onclick = event => run(event.currentTarget, async () => {
  await request('/api/auth/reveal', {method: 'POST'});
  notice('장치 화면에서 비밀번호를 확인하세요.');
});
get('logout').onclick = event => run(event.currentTarget, async () => {
  await request('/api/auth/logout', {method: 'POST'});
  await refreshStatus();
  notice('로그아웃했습니다.');
});
get('scan').onclick = event => run(event.currentTarget, async () => {
  notice('주변 Wi-Fi를 검색하는 중입니다.');
  const names = await (await request('/scanwifi')).json();
  get('networks').replaceChildren(...Array.from(new Set(names), name => new Option(name, name)));
  notice(names.length ? '네트워크 이름 칸에서 선택하거나 직접 입력하세요.' : '네트워크 이름을 직접 입력하세요.');
});
bindForm('connect', async form => {
  await postForm(form);
  get('wifi-key').value = '';
  restartPending = true;
  notice('저장했습니다. 재시작 후 장치 화면에 표시된 주소로 접속하세요.');
});
get('load-files').onclick = async event => {
  if (busy || restartPending) return;
  const button = event.currentTarget;
  const summary = get('file-summary');
  button.disabled = true;
  get('file-rows').replaceChildren();
  get('file-table').hidden = true;
  summary.textContent = '파일 목록을 읽는 중입니다.';
  try {
    const {files, complete} = await (await request('/api/storage/files', {cache: 'no-store'})).json();
    if (get('files').hidden) return;
    files.sort((a, b) => b.bytes - a.bytes || a.path.localeCompare(b.path));
    const rows = document.createDocumentFragment();
    let total = 0;
    for (const {path, bytes} of files) {
      const row = document.createElement('tr');
      row.insertCell().textContent = path;
      row.insertCell().textContent = bytes.toLocaleString('ko-KR');
      rows.append(row);
      total += bytes;
    }
    get('file-rows').append(rows);
    get('file-table').hidden = files.length === 0;
    summary.textContent = files.length.toLocaleString('ko-KR') + '개 · 파일 크기 합계 '
      + total.toLocaleString('ko-KR') + '바이트'
      + (complete ? '' : ' · 일부 경로를 읽지 못했습니다.');
  } catch {
    if (!get('files').hidden) summary.textContent = '파일 목록을 읽을 수 없습니다.';
  } finally {
    button.disabled = false;
  }
};
get('level').oninput = () => {
  showBrightness();
  clearTimeout(brightnessSaveTimer);
  brightnessSaveTimer = setTimeout(saveBrightness, 500);
  queueBrightness(true);
};
bindForm('ota', async form => {
  const file = get('firmware').files[0];
  if (!file || !/\.bin$/i.test(file.name)) throw new Error('.bin 파일을 선택하세요.');
  notice('펌웨어를 보내는 중입니다. 재시작이 끝날 때까지 전원을 연결해 두세요.');
  await request(form.action, {method: 'POST', body: new FormData(form)});
  restartPending = true;
  notice('업데이트가 완료됐습니다. 재시작 후 장치 화면에 표시된 주소로 접속하세요.');
});

refreshStatus().catch(showError);
</script>
</html>
